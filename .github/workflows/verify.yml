name: Verify source

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/docs/gates/**'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Check backend source
        working-directory: backend
        run: python scripts/static_checks.py
      - name: Test backend and export initialization
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_game_showcase_auth.py
          tests/test_site_config_revalidate.py
          tests/test_link_category_validation.py
          tests/test_links_random_route.py
          tests/test_error_envelope.py
          tests/test_project_stats_sync.py
          tests/test_public_initialization.py
          tests/test_photo_upload_auth.py
          -p no:cacheprovider -W ignore::DeprecationWarning
      - name: Check backend coverage
        working-directory: backend
        run: python scripts/coverage_gate.py
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Verify bundled assets
        working-directory: web
        run: npm run verify-assets
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --ignore-scripts
      - name: Build admin
        working-directory: admin
        run: npm run build
