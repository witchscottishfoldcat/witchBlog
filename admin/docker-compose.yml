version: '3.8'

services:
  web:
    container_name: witchcatweb-bd
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    environment:
      - NODE_ENV=production
    # 可以添加卷挂载来实现热重载（开发环境）
    # volumes:
    #   - .:/app
    #   - /app/node_modules
