server {
    listen 8080;
    server_name localhost;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # img-src 白名单：管理页直接渲染的外链封面 CDN——
    # 网易云音乐歌单/曲目封面（p1/p2.music.126.net，DB 中 http/https 两种Scheme并存）、
    # Steam 游戏封面（shared.akamai/fastly/cloudflare.steamstatic.com）、
    # B 站追番封面预览（i0/i1/i2.hdslb.com）。站内图片统一走同源 /api/v1/proxy/oss。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://p1.music.126.net https://p1.music.126.net http://p2.music.126.net https://p2.music.126.net https://*.steamstatic.com https://*.hdslb.com http://*.hdslb.com; font-src 'self' data:; connect-src 'self'" always;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（React Router）
    # add_header 不跨层级继承：本块内重复声明安全头，并为 SPA 入口加 no-store，
    # 防止 EdgeOne 等共享缓存缓存 index.html 导致发版/CSP 更新对用户长时间不生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://p1.music.126.net https://p1.music.126.net http://p2.music.126.net https://p2.music.126.net https://*.steamstatic.com https://*.hdslb.com http://*.hdslb.com; font-src 'self' data:; connect-src 'self'" always;
        add_header Cache-Control "no-store" always;
    }

    # API 代理 - 将 /api 请求代理到后端服务器
    # 注意：管理后台与 API 同源（本 nginx），无需 CORS；
    # 跨域策略由后端 CORS 中间件统一控制，此处不再添加
    # Access-Control-Allow-Origin: * 之类的通配头（会放行任意站点携带
    # Authorization 跨域调用管理 API）。
    # ^~ 使 /api 前缀优先于下方静态资源正则 location，
    # 否则以 .png/.jpg 等结尾的代理图片 URL（如 /api/v1/proxy/oss/...）
    # 会被正则劫持到静态目录而 404
    location ^~ /api {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 请求体大小限制（与后端上传上限对齐）
        client_max_body_size 12m;

        # 后台 API 响应绝不允许共享缓存（EdgeOne 曾缓存 /api/v1/albums/ 列表，
        # 导致后台看到旧数据）；add_header 不跨层级继承，nosniff 需在本块重申
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
